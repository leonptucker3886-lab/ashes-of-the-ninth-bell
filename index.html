.bar.mp>b{background:linear-gradient(90deg,#5a3ad6,#c27aff)}
.unit.active{border-color:var(--gold);box-shadow:0 0 18px #e8c27a66;transform:translateY(-6px)}
.unit.target{animation:pulse .8s infinite}
.unit.dead{filter:grayscale(1) brightness(.35);transform:scale(.88)}
.unit.hit{animation:hit .3s}
.st{font-size:10px;color:var(--ember);min-height:12px}
@keyframes pulse{50%{box-shadow:0 0 22px #ff3a3a;border-color:#ff5a5a}}
@keyframes hit{25%{transform:translateX(-6px) rotate(-4deg);filter:brightness(3)}75%{transform:translateX(6px)}}
#skills{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px;min-height:118px}
#skills .btn{margin:0;padding:10px 5px;font-size:14px}
#skills .btn small{display:block;font-size:11px;color:var(--dim);font-weight:400}

.fx{position:fixed;pointer-events:none;z-index:50;font:900 24px Georgia;color:#fff;text-shadow:0 0 8px #ff3a00,0 2px 0 #000;animation:float 1s ease-out forwards}
.fx.heal{color:#9dffb0;text-shadow:0 0 8px #0f8}.fx.crit{font-size:34px;color:#ffd36a}
@keyframes float{from{opacity:1;transform:translate(-50%,0) scale(1.3)}to{opacity:0;transform:translate(-50%,-70px) scale(.9)}}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
#flash{position:fixed;inset:0;background:#ff9a5a;opacity:0;pointer-events:none;z-index:40;transition:opacity .25s}
.hud{display:flex;justify-content:space-between;color:var(--gold);font-size:14px;padding:6px 2px}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #ffffff11}
.shopitem .ic{font-size:28px}.shopitem .d{flex:1;font-size:14px}.shopitem .d small{color:var(--dim);display:block}

.warn{font-size:11px;color:var(--dim);text-align:center;margin-top:8px}

<script>
// ===== AUDIO =====
let AC=null,MG=null,muted=false;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination)}if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.2,slide=0,delay=0){if(muted)return;const a=ac(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(MG);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.3,freq=1200,delay=0){if(muted)return;const a=ac(),t=a.currentTime+delay,b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=v;s.connect(f).connect(g).connect(MG);s.start(t)}
const SFX={
 click(){tone(660,.06,'triangle',.12)},
 hit(){noise(.18,.4,1800);tone(140,.15,'square',.15,-80)},
 crit(){noise(.3,.5,3000);tone(90,.3,'sawtooth',.2,-50);tone(880,.12,'square',.08)},
 fire(){noise(.5,.35,900);tone(220,.4,'sawtooth',.12,300)},
 heal(){[523,659,784,1046].forEach((f,i)=>tone(f,.3,'sine',.1,0,i*.07))},
 shield(){tone(300,.4,'triangle',.18,200);tone(450,.4,'sine',.1)},
 gun(){noise(.12,.7,4000);tone(70,.25,'square',.25,-40)},
 bell(){[1,2.76,5.4].forEach(m=>tone(110*m,2.4,'sine',.18/m))},
 die(){tone(200,.7,'sawtooth',.15,-170)},
 win(){[392,523,659,784].forEach((f,i)=>tone(f,.4,'triangle',.12,0,i*.12))},
 lose(){[392,311,262,196].forEach((f,i)=>tone(f,.6,'sawtooth',.1,0,i*.25))},
 coin(){tone(1200,.08,'square',.06);tone(1600,.1,'square',.06,0,.07)}
};
let droneOn=false;function drone(){if(droneOn||muted)return;droneOn=true;const a=ac();[55,82.4].forEach(f=>{const o=a.createOscillator(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();o.type='sawtooth';o.frequency.value=f;const fl=a.createBiquadFilter();fl.type='lowpass';fl.frequency.value=220;g.gain.value=.035;l.frequency.value=.08;lg.gain.value=80;l.connect(lg).connect(fl.frequency);o.connect(fl).connect(g).connect(MG);o.start();l.start()});setInterval(()=>{if(!muted&&Math.random()<.5)SFX.bell()},14000)}
document.getElementById('mute').onclick=()=>{muted=!muted;ac();if(MG)MG.gain.value=muted?0:.5;document.getElementById('mute').textContent=muted?'🔇':'🔊'};

// ===== BACKGROUND: embers + smog =====
const cv=document.getElementById('bg'),cx=cv.getContext('2d');let W,H,parts=[],bgTint=[60,14,10];
function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio}addEventListener('resize',rs);rs();
for(let i=0;i<70;i++)parts.push({x:Math.random(),y:Math.random(),s:Math.random()*2+.5,v:Math.random()*.0015+.0004,w:Math.random()*6});
let burst=[];function emberBurst(x,y,n=24,col='255,140,60'){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*5+1;burst.push({x:x*devicePixelRatio,y:y*devicePixelRatio,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,c:col})}}
function frame(t){const g=cx.createRadialGradient(W/2,H*1.1,0,W/2,H*1.1,H*1.2);g.addColorStop(0,`rgb(${bgTint})`);g.addColorStop(.5,'#1a0810');g.addColorStop(1,'#050208');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 // bell towers silhouette
 cx.fillStyle='#0a0408';for(let i=0;i<9;i++){const bx=W*(i/8),bh=H*(.18+((i*37)%10)/40);cx.fillRect(bx-W*.03,H-bh,W*.06,bh);cx.beginPath();cx.moveTo(bx-W*.04,H-bh);cx.lineTo(bx,H-bh-W*.07);cx.lineTo(bx+W*.04,H-bh);cx.fill()}
 for(const p of parts){p.y-=p.v;p.x+=Math.sin(t/1000+p.w)*.0004;if(p.y<0){p.y=1;p.x=Math.random()}const a=.4+.6*Math.sin(t/300+p.w);cx.fillStyle=`rgba(255,${120+p.w*15|0},50,${a*.8})`;cx.beginPath();cx.arc(p.x*W,p.y*H,p.s*devicePixelRatio,0,6.28);cx.fill()}
 cx.globalCompositeOperation='lighter';for(let i=burst.length-1;i>=0;i--){const b=burst[i];b.x+=b.vx;b.y+=b.vy;b.vy+=.15;b.l-=.025;if(b.l<=0){burst.splice(i,1);continue}cx.fillStyle=`rgba(${b.c},${b.l})`;cx.beginPath();cx.arc(b.x,b.y,3*devicePixelRatio*b.l,0,6.28);cx.fill()}cx.globalCompositeOperation='source-over';
 requestAnimationFrame(frame)}requestAnimationFrame(frame);

// ===== SAVE =====
const KEY='ninthbell_v1';
const defSave={marks:0,best:0,upg:{hp:0,atk:0,mp:0,heal:0,crit:0},run:null,clears:0};
let S;try{S=Object.assign({},defSave,JSON.parse(localStorage.getItem(KEY)||'{}'));S.upg=Object.assign({},defSave.upg,S.upg)}catch(e){S=JSON.parse(JSON.stringify(defSave))}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}

// ===== DATA =====
const HEROES=[
 {id:'sera',name:'Sera Vane',spr:'🔥',role:'Ashwitch',hp:70,mp:40,atk:14,skills:[
  {n:'Cinder Lash',c:0,t:'enemy',p:1.0,fx:'fire',d:'Basic flame'},

 {id:'dain',name:'Dain Holloway',spr:'🛡️',role:'Deaf Bellguard',hp:120,mp:24,atk:11,skills:[
  {n:'Brass Maul',c:0,t:'enemy',p:1.0,fx:'hit',d:'Basic strike'},
  {n:'Hold the Line',c:8,t:'party',guard:2,fx:'shield',d:'Party takes ½ dmg'},
  {n:'Taunt',c:5,t:'self',taunt:3,fx:'shield',d:'Foes target Dain'},
  {n:'Skull Ringer',c:10,t:'enemy',p:1.6,stun:1,fx:'hit',d:'Hit + stun'}]},
 {id:'mott',name:'Mother Mott',spr:'🩸',role:'Gutter-Surgeon',hp:80,mp:45,atk:10,skills:[
  {n:'Rust Scalpel',c:0,t:'enemy',p:1.0,poison:3,fx:'hit',d:'Hit + poison'},
  {n:'Stitch',c:8,t:'ally',heal:40,fx:'heal',d:'Heal one ally'},
  {n:'Laudanum Mist',c:18,t:'party',heal:24,fx:'heal',d:'Heal party'},
  {n:'Back-Alley Revive',c:22,t:'dead',heal:.4,fx:'heal',d:'Revive at 40%'}]},
 {id:'ivo',name:'Ivo Kestrel',spr:'🔫',role:'Foundry Gunner',hp:75,mp:30,atk:15,skills:[
  {n:'Hand-Cannon',c:0,t:'enemy',p:1.1,fx:'gun',d:'Basic shot'},
  {n:'Shrapnel Shell',c:10,t:'all',p:.8,fx:'gun',brk:3,d:'All foes, -armor'},
  {n:'Bell-Iron Slug',c:14,t:'enemy',p:2.6,fx:'gun',d:'Huge single shot'},
  {n:'Reload Ash',c:0,t:'self',mpgain:12,d:'+12 MP'}]}
];
const FOES={
 thug:{name:'Gallows Thug',spr:'🧟',hp:45,atk:9},
 greyeye:{name:'Greyeye Addict',spr:'👁️',hp:35,atk:11},
 hound:{name:'Ash Hound',spr:'🐺',hp:40,atk:12},
 drowned:{name:'Drowned Acolyte',spr:'🧜',hp:55,atk:10,ai:'heal'},
 priest:{name:'Tide-Priest Orm',spr:'🐙',hp:180,atk:14,boss:1,ai:'aoe'},
 guard:{name:'Synod Bellguard',spr:'🗿',hp:70,atk:13,armor:4},
 automaton:{name:'Clapper Automaton',spr:'🤖',hp:90,atk:15,armor:6,ai:'aoe'},
 wraith:{name:'Ash Wraith',spr:'👻',hp:50,atk:14,ai:'drain'},
 tuner:{name:'Bell-Tuner Calloway',spr:'🎻',hp:300,atk:17,boss:1,armor:4,ai:'bell'}
};
const NODES=[
 {name:'The Gallows Market',x:150,y:375,next:[1,2],foes:['thug','thug','greyeye'],
 pre:`Year 512 After the Ember.\n\nEight bells hang over Corrow. Each toll pulls ash from the earth, and ash is power. It feeds the furnaces and the Synod, and it rots the lungs of everyone below the Brass Line.\n\nThree nights ago the Synod took your sister Lira from her bed. Her crime was that she could hear the bells "sing back."\n\nYou are Sera Vane, an unbranded witch, and you have not burned blood in six years.\n\nTonight you will.\n\nIn the Gallows Market the hanged still sway. Dain, a deaf Bellguard, owes you a life. Mother Mott, a surgeon, owes you money. Ivo, a foundry boy, knows where they took the girls.\n\nThe market toughs have been paid to keep you here.`,
 post:`The last thug gurgles through a cut throat. Mott wipes her scalpel on his coat.\n\n"Two ways to the Foundry," Ivo says. "Through the Drowned Chapel, where the old priests pray to the god's corpse. Or straight up Foundry Row, through Synod steel."\n\nDain signs with scarred hands: *Either way, we die loud.*`},
 {name:'The Drowned Chapel',x:65,y:265,next:[3],foes:['drowned','priest','drowned'],
 pre:`The chapel sank a century ago, but its priests never left.\n\nThey kneel waist-deep in black water and sing the Old Hymn: "Eight for the living, the ninth for the dead."\n\nTheir leader, Orm, turns. His face is wrapped in a net, and something moves beneath it.\n\n"Witch. You smell of Grandmother Cinder. The Synod has cast the Ninth Bell, and your sister is its tongue. Give yourself to the water and the god will spare her."\n\nYou do not believe him. You burn him anyway.`,
 post:`Orm sinks, laughing. "When it rings, the dead will remember. You will remember."\n\nIn his reliquary you find a scorched page. It shows a bell nine storeys tall, with a girl's silhouette chained in its mouth.\n\nMott is silent for a long while. Then she says, "We're running out of night."`},
 {name:'Foundry Row',x:235,y:265,next:[3],foes:['guard','automaton','guard'],
 pre:`Foundry Row never sleeps. Molten bell-iron runs in open channels, and the air tastes of pennies.\n\nThe Synod's automatons, called Clappers, are walking bells. Every step they take is a toll.\n\nA Bellguard captain sees Dain's broken oath-mask and spits. "Deserter. They'll cast your bones into the next bell."\n\nDain can't hear him, and smiles anyway.`,
 post:`The Clapper falls, ringing like a funeral.\n\nIvo pulls a manifest from the captain's coat. "Forty-one girls. All 'resonant.' All sent to Ashwell for 'tuning.'" His voice cracks. "My sister's on here too."\n\nNow there are two sisters to save.`},
 {name:'Ashwell',x:150,y:165,next:[4],foes:['wraith','hound','wraith','hound'],
 pre:`Ashwell is the mile-deep pit the bells pull ash from. They say the god's ribs at the bottom are still warm.\n\nThe ash here is alive. It takes the shapes of the people it buried: wraiths with miners' faces, and hounds made of cinder.\n\nSera's blood hums. Now she hears the singing Lira heard.\n\nIt is beautiful, and that is the worst part.`,
 post:`The wraiths fall apart into drifts. One with a child's face whispers your name as it goes.\n\nAbove the pit swings a great iron cradle: the casting gate of the Ninth Bell.\n\nMott hands you a vial. "If you burn what I think you'll burn, this keeps your heart beating. Mostly."`},
 {name:'The Ninth Bell',x:150,y:60,next:[],foes:['automaton','tuner','guard'],
 pre:`The Ninth Bell hangs in the dark. It is taller than a cathedral, and it is unfinished. Forty-one iron cradles line its mouth.\n\nOne of them holds Lira. She is singing, but the voice is not hers.\n\nA thin man in velvet lowers a bow strung with human sinew. This is Bell-Tuner Calloway.\n\n"Miss Vane. Your sister is the purest note I've ever found. When the Ninth rings, the Ember wakes, and the Synod will own a god."\n\nHe draws the bow, and the whole foundry hums.`,
 post:`Calloway falls. His bow snaps, and the sinew lashes like a living thing.\n\nYou tear Lira from the cradle. When she opens her eyes, they are Ember-gold.\n\n"Sera," she says, in two voices. "It already heard me. It's awake."\n\nFar below, something a mile long and warm takes its first breath in five hundred years.\n\nAll eight bells of Corrow ring at once, and no hand pulls their ropes.\n\n— END OF CHAPTER I —\nChapter II, "The Synod of Brass," is coming.`}
];
const LORE=`THE BOOK OF VEYL\n\nTHE EMBER: A god burned out over the world and fell as ash. Ember is the ash in soil, water and blood, and it is the source of all magic. Years are counted AE, After the Ember.\n\nCORROW: The city of eight bells, ruled by the Bell Synod. Each toll pulls ash up out of Ashwell. Below the Brass Line, people cough black.\n\nASHWITCHES: People who burn Ember from their own blood. They are licensed by brand, or else hanged.\n\nBELLGUARD: Enforcers who are deafened when they take their oath, so the bells cannot drive them mad.\n\nTHE DROWNED FAITH: The last priests of the old god. They believe the bells are waking His corpse.\n\nTALE OF THE NINTH BELL: "Eight bells for the living, the ninth for the dead. When the ninth is rung, the Ember will remember it was a god."\n\nTALE OF GRANDMOTHER CINDER: Ysolde, the first witch, swallowed a coal from the god's heart five hundred years ago. Every witch since carries a spark of her.\n\nTALE OF THE GLASS CHILD: "One day a mind of light will speak for the god, and every bell will fall silent."`;

// ===== CORE =====
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.mk').forEach(e=>e.textContent='🜂 '+S.marks+' Ash Marks');refreshMenu()}
function refreshMenu(){$('m-best').textContent='🏆 Best: '+S.best;$('m-marks').textContent='🜂 '+S.marks;$('b-cont').style.display=S.run?'block':'none'}
function shake(){const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake');if(navigator.vibrate)navigator.vibrate(30)}
function flash(c='#ff9a5a',o=.35){const f=$('flash');f.style.background=c;f.style.opacity=o;setTimeout(()=>f.style.opacity=0,90)}
function floatTxt(el,txt,cls=''){const r=el.getBoundingClientRect(),d=document.createElement('div');d.className='fx '+cls;d.textContent=txt;d.style.left=(r.left+r.width/2+(Math.random()*20-10))+'px';d.style.top=(r.top+10)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const U=S.upg;
function newRun(){S.run={node:0,done:[],score:0,party:HEROES.map(h=>{const mhp=Math.round(h.hp*(1+.12*U.hp)),mmp=Math.round(h.mp*(1+.12*U.mp));return{id:h.id,hp:mhp,mhp,mp:mmp,mmp}})};save()}
function hero(id){return HEROES.find(h=>h.id===id)}

// story
let storyCb=null;
function story(title,text,cb,btn='Continue'){$('st-title').textContent=title;$('st-text').textContent='';$('st-next').textContent=btn;storyCb=cb;show('s-story');let i=0;const el=$('st-text');clearInterval(story.t);story.t=setInterval(()=>{i+=3;el.textContent=text.slice(0,i);el.scrollTop=el.scrollHeight;if(i>=text.length)clearInterval(story.t)},12);story.full=text}
$('st-next').onclick=()=>{SFX.click();if($('st-text').textContent.length<story.full.length){clearInterval(story.t);$('st-text').textContent=story.full;return}storyCb&&storyCb()};

// map
function drawMap(){const R=S.run,svg=$('mapsvg');let h=`<defs><radialGradient id="gl"><stop offset="0" stop-color="#ff7a2f"/><stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/></radialGradient><filter id="bl"><feGaussianBlur stdDeviation="2"/></filter></defs>`;
 h+=`<path d="M0 400 Q80 330 150 360 T300 380 L300 420 L0 420Z" fill="#1a0a0a"/><circle cx="150" cy="165" r="40" fill="#000" stroke="#ff7a2f33" stroke-width="3"/><text x="150" y="215" fill="#a8968a" font-size="9" text-anchor="middle">the pit</text>`;
 NODES.forEach((n,i)=>n.next.forEach(j=>{const m=NODES[j],act=R.done.includes(i);h+=`<line x1="${n.x}" y1="${n.y}" x2="${m.x}" y2="${m.y}" stroke="${act?'#e8c27a':'#e8c27a33'}" stroke-width="2" stroke-dasharray="5 5"/>`}));
 NODES.forEach((n,i)=>{const done=R.done.includes(i),avail=avail_(i);h+=`<g class="node" data-i="${i}">${avail?`<circle cx="${n.x}" cy="${n.y}" r="30" fill="url(#gl)"><animate attributeName="r" values="22;32;22" dur="1.6s" repeatCount="indefinite"/></circle>`:''}<circle cx="${n.x}" cy="${n.y}" r="17" fill="${done?'#3a2a1a':'#2a0f12'}" stroke="${avail?'#ffcf7a':done?'#7a6a4a':'#5a3a3a'}" stroke-width="2.5"/><text x="${n.x}" y="${n.y+6}" font-size="17" text-anchor="middle">${done?'✔️':i==4?'🔔':i==1?'⛪':i==2?'🏭':i==3?'🕳️':'⚖️'}</text><text x="${n.x}" y="${n.y+33}" font-size="11" fill="${avail?'#ffcf7a':'#a8968a'}" text-anchor="middle" font-family="Georgia">${n.name}</text></g>`});
 svg.innerHTML=h;svg.querySelectorAll('.node').forEach(g=>g.onclick=()=>{const i=+g.dataset.i;if(avail_(i)){SFX.bell();enterNode(i)}})}
function avail_(i){const R=S.run;if(R.done.includes(i))return false;if(i===0)return R.done.length===0;if(i===2&&R.done.includes(1))return false;if(i===1&&R.done.includes(2))return false;return NODES.some((n,j)=>R.done.includes(j)&&n.next.includes(i))}
function toMap(){bgTint=[60,14,10];drawMap();show('s-map')}
function enterNode(i){story(NODES[i].name,NODES[i].pre,()=>startBattle(i),'⚔️ Fight')}
$('mp-camp').onclick=()=>{SFX.heal();S.run.party.forEach(p=>{if(p.hp>0){p.hp=Math.min(p.mhp,p.hp+Math.round(p.mhp*.3));p.mp=Math.min(p.mmp,p.mp+Math.round(p.mmp*.3))}});const c=10;if(S.marks>=c){S.marks-=c}save();story('Camp','You hide in a dead chandler\'s shop. Mott boils the needles. Dain watches the door. Ivo cleans his gun twice, three times.\n\nEveryone standing recovers 30% of their HP and MP.\n\n(The tallow cost 10 Ash Marks, if you had them.)',toMap)};
$('mp-menu').onclick=()=>{SFX.click();show('s-menu')};$('mp-shop').onclick=()=>{shopBack=toMap;openShop()};

// ===== BATTLE =====
let B=null;
function startBattle(ni){const R=S.run,sc=1+.18*ni+.35*S.clears;bgTint=ni==4?[110,20,10]:ni==3?[40,40,50]:ni==1?[10,30,50]:[60,14,10];
 B={ni,round:1,busy:false,foes:NODES[ni].foes.map((k,i)=>{const f=FOES[k];return{k,i,name:f.name,spr:f.spr,boss:f.boss,ai:f.ai,armor:f.armor||0,mhp:Math.round(f.hp*sc),hp:Math.round(f.hp*sc),atk:Math.round(f.atk*sc),burn:0,poison:0,stun:0,brk:0}}),
 party:R.party.map(p=>Object.assign({},p,{guard:0,taunt:0,burn:0})),turn:0,sel:null};
 $('bt-title').textContent=NODES[ni].name;show('s-battle');render();nextHero();}
function unitEl(side,i){return document.querySelector(`#${side} .unit[data-i="${i}"]`)}
function render(){const e=$('enemies'),p=$('party');$('bt-round').textContent='Round '+B.round;
 e.innerHTML=B.foes.map((f,i)=>`<div class="unit enemy ${f.boss?'boss':''} ${f.hp<=0?'dead':''}" data-i="${i}"><div class="st">${f.stun?'💫':''}${f.burn?'🔥'+f.burn:''}${f.poison?'☠️'+f.poison:''}${f.brk?'🔻':''}</div><div class="spr">${f.spr}</div><div class="nm">${f.name}</div><div class="bar"><b style="width:${f.hp/f.mhp*100}%"></b></div></div>`).join('');
 p.innerHTML=B.party.map((h,i)=>{const H=hero(h.id);return`<div class="unit ${h.hp<=0?'dead':''} ${B.turn===i&&!B.busy?'active':''}" data-i="${i}"><div class="st">${h.guard?'🛡':''}${h.taunt?'😤':''}${h.burn?'🔥':''}</div><div class="spr">${H.spr}</div><div class="nm">${H.name.split(' ')[0]} ${h.hp}/${h.mhp}</div><div class="bar"><b style="width:${h.hp/h.mhp*100}%"></b></div><div class="bar mp"><b style="width:${h.mp/h.mmp*100}%"></b></div></div>`}).join('');
 e.querySelectorAll('.unit').forEach(el=>el.onclick=()=>pickTarget('foe',+el.dataset.i));
 p.querySelectorAll('.unit').forEach(el=>el.onclick=()=>pickTarget('ally',+el.dataset.i));
 if(B.sel){const t=B.sel.t;if(t==='enemy')e.querySelectorAll('.unit:not(.dead)').forEach(x=>x.classList.add('target'));if(t==='ally')p.querySelectorAll('.unit:not(.dead)').forEach(x=>x.classList.add('target'));if(t==='dead')p.querySelectorAll('.unit.dead').forEach(x=>x.classList.add('target'))}}
function log(t){$('log').textContent=t}
function nextHero(){while(B.turn<4&&B.party[B.turn].hp<=0)B.turn++;if(B.turn>=4){enemyPhase();return}B.sel=null;render();const h=B.party[B.turn],H=hero(h.id);log(H.name+' — choose an action');
 $('skills').innerHTML=H.skills.map((s,i)=>{const dis=h.mp<s.c||(s.t==='dead'&&!B.party.some(x=>x.hp<=0))||(s.hpcost&&h.hp<=s.hpcost);return`<button class="btn" data-i="${i}" ${dis?'disabled':''}>${s.n}${s.c?' · '+s.c+'MP':''}<small>${s.d}</small></button>`}).join('');
 $('skills').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{SFX.click();const s=H.skills[+b.dataset.i];if(['self','party','all'].includes(s.t)){act(s,null)}else{B.sel=s;log('Choose a target: '+s.n);render()}})}
function pickTarget(side,i){if(!B.sel||B.busy)return;const s=B.sel,t=side==='foe'?B.foes[i]:B.party[i];if(s.t==='enemy'&&(side!=='foe'||t.hp<=0))return;if(s.t==='ally'&&(side!=='ally'||t.hp<=0))return;if(s.t==='dead'&&(side!=='ally'||t.hp>0))return;act(s,i)}
function dmgCalc(base,p,target){const crit=Math.random()<.08+.04*U.crit;let d=base*p*(.9+Math.random()*.2)*(crit?1.8:1);d-=Math.max(0,(target.armor||0)-(target.brk||0));return{d:Math.max(1,Math.round(d)),crit}}
async function hitFoe(f,s,h){const H=hero(h.id),{d,crit}=dmgCalc(H.atk*(1+.1*U.atk),s.p,f);f.hp=Math.max(0,f.hp-d);const el=unitEl('enemies',f.i);el&&el.classList.add('hit');const r=el.getBoundingClientRect();emberBurst(r.left+r.width/2,r.top+r.height/2,crit?40:18,s.fx==='fire'?'255,120,40':s.fx==='gun'?'255,220,150':'255,80,80');floatTxt(el,(crit?'CRIT ':'')+d,crit?'crit':'');(crit?SFX.crit:s.fx==='fire'?SFX.fire:s.fx==='gun'?SFX.gun:SFX.hit)();shake();if(crit)flash('#fff',.25);
 if(s.burn)f.burn=s.burn;if(s.poison)f.poison=s.poison;if(s.stun)f.stun=s.stun;if(s.brk)f.brk=s.brk;if(f.hp<=0){SFX.die();S.run.score+=f.boss?50:10}}
async function act(s,ti){B.busy=true;B.sel=null;$('skills').innerHTML='';const h=B.party[B.turn],H=hero(h.id);h.mp-=s.c;log(H.name+' uses '+s.n+'!');render();await sleep(250);
 if(s.t==='enemy')await hitFoe(B.foes[ti],s,h);
 else if(s.t==='all'){for(const f of B.foes)if(f.hp>0)await hitFoe(f,s,h)}
 else if(s.t==='ally'||s.t==='party'||s.t==='dead'){const tg=s.t==='party'?B.party.filter(x=>x.hp>0):[B.party[ti]];tg.forEach(x=>{const i=B.party.indexOf(x);if(s.heal){const amt=s.t==='dead'?Math.round(x.mhp*s.heal):Math.round(s.heal*(1+.15*U.heal));x.hp=Math.min(x.mhp,x.hp+amt);floatTxt(unitEl('party',i),'+'+amt,'heal');const r=unitEl('party',i).getBoundingClientRect();emberBurst(r.left+r.width/2,r.top+20,16,'120,255,170')}if(s.guard){x.guard=s.guard}});(s.heal?SFX.heal:SFX.shield)()}
 else if(s.t==='self'){if(s.hpcost){h.hp-=s.hpcost;floatTxt(unitEl('party',B.turn),'-'+s.hpcost);SFX.fire();flash('#c2263a',.3)}if(s.mpgain){h.mp=Math.min(h.mmp,h.mp+s.mpgain);SFX.coin()}if(s.taunt){h.taunt=s.taunt;SFX.shield()}}
 await sleep(450);render();if(checkEnd())return;B.busy=false;B.turn++;nextHero()}

async function hurtHero(i,dmg,src){const h=B.party[i];if(h.hp<=0)return;let d=Math.round(dmg*(.85+Math.random()*.3));if(h.guard)d=Math.round(d/2);h.hp=Math.max(0,h.hp-d);const el=unitEl('party',i);if(el){el.classList.add('hit');floatTxt(el,'-'+d);const r=el.getBoundingClientRect();emberBurst(r.left+r.width/2,r.top+20,14,'255,60,60')}SFX.hit();shake();flash('#c2263a',.22);if(h.hp<=0){SFX.die();log(hero(h.id).name+' falls!')}}
function pickHero(){const live=B.party.map((h,i)=>i).filter(i=>B.party[i].hp>0);const t=live.filter(i=>B.party[i].taunt);if(t.length)return t[0];return live[Math.floor(Math.random()*live.length)]}
async function enemyPhase(){B.busy=true;render();
 for(const f of B.foes){if(f.hp<=0)continue;
  if(f.burn){const d=Math.round(f.mhp*.06)+4;f.hp=Math.max(0,f.hp-d);f.burn--;floatTxt(unitEl('enemies',f.i),'🔥'+d);if(f.hp<=0){S.run.score+=f.boss?50:10;render();continue}}
  if(f.poison){const d=Math.round(f.mhp*.05)+3;f.hp=Math.max(0,f.hp-d);f.poison--;floatTxt(unitEl('enemies',f.i),'☠'+d);if(f.hp<=0){S.run.score+=f.boss?50:10;render();continue}}
  if(f.brk)f.brk--;
  if(f.stun){f.stun--;log(f.name+' is stunned!');render();await sleep(500);continue}
  const el=unitEl('enemies',f.i);el&&(el.style.transform='translateY(14px) scale(1.1)');await sleep(220);el&&(el.style.transform='');
  const r=Math.random();
  if(f.ai==='heal'&&r<.35){const t=B.foes.filter(x=>x.hp>0).sort((a,b)=>a.hp/a.mhp-b.hp/b.mhp)[0];const amt=Math.round(t.mhp*.2);t.hp=Math.min(t.mhp,t.hp+amt);log(f.name+' chants. The water mends '+t.name+'.');SFX.heal();floatTxt(unitEl('enemies',t.i),'+'+amt,'heal')}
  else if((f.ai==='aoe'&&r<.35)||(f.ai==='bell'&&r<.3)){log(f.ai==='bell'?'Calloway draws the bow. The Ninth Bell SCREAMS.':f.name+' unleashes a sweeping blow!');if(f.ai==='bell'){SFX.bell();flash('#ffd36a',.5)}for(let i=0;i<4;i++)await hurtHero(i,f.atk*(f.ai==='bell'?.9:.7))}
  else if(f.ai==='bell'&&r<.5){log('Calloway plays a dirge of sinew. Every hero burns.');SFX.fire();B.party.forEach(h=>{if(h.hp>0)h.mp=Math.max(0,h.mp-6)});await hurtHero(pickHero(),f.atk*1.3)}
  else if(f.ai==='drain'&&r<.4){const i=pickHero();log(f.name+' drinks a memory.');await hurtHero(i,f.atk);f.hp=Math.min(f.mhp,f.hp+Math.round(f.atk*.6));B.party[i].mp=Math.max(0,B.party[i].mp-5)}
  else{const i=pickHero();log(f.name+' attacks '+hero(B.party[i].id).name+'.');await hurtHero(i,f.atk)}
  render();await sleep(450);if(checkEnd())return}
 B.party.forEach(h=>{if(h.guard)h.guard--;if(h.taunt)h.taunt--;if(h.hp>0)h.mp=Math.min(h.mmp,h.mp+3)});
 B.round++;B.turn=0;B.busy=false;if(checkEnd())return;nextHero()}
function checkEnd(){if(B.foes.every(f=>f.hp<=0)){win();return true}if(B.party.every(h=>h.hp<=0)){lose();return true}return false}
function win(){SFX.win();const R=S.run,ni=B.ni,earned=20+ni*12+(NODES[ni].next.length?0:60);S.marks+=earned;R.score+=earned;
 R.party=B.party.map(h=>({id:h.id,mhp:h.mhp,mmp:h.mmp,hp:h.hp>0?h.hp:Math.round(h.mhp*.25),mp:h.mp}));R.done.push(ni);save();
 for(let i=0;i<6;i++)setTimeout(()=>emberBurst(Math.random()*innerWidth,innerHeight*.4,30,'255,200,90'),i*120);
 setTimeout(()=>{if(!NODES[ni].next.length){story(NODES[ni].name,NODES[ni].post+`\n\n🜂 +${earned} Ash Marks`,chapterEnd,'Finish the Chapter')}else story(NODES[ni].name,NODES[ni].post+`\n\n🜂 +${earned} Ash Marks earned. Anyone who fell is stitched back up by Mott at 25% HP.`,toMap)},900)}
function lose(){SFX.lose();const sc=S.run.score;if(sc>S.best)S.best=sc;S.run=null;save();setTimeout(()=>{$('ov-title').textContent='THE BELL TOLLS';$('ov-text').textContent=`Your party dies in the ash of Corrow. The Synod will melt your bones into bell-iron.\n\nScore: ${sc}    Best: ${S.best}\nYou keep the Ash Marks you earned. Spend them in the Surgeon's Den and try again.`;show('s-over')},900)}
function chapterEnd(){const sc=S.run.score+100;S.clears++;if(sc>S.best)S.best=sc;S.run=null;save();$('ov-title').textContent='CHAPTER I COMPLETE';$('ov-text').textContent=`Score: ${sc}    Best: ${S.best}\n\nBell Toll ${S.clears+1} unlocked. Enemies now grow stronger with every clear. How deep can you go?`;show('s-over')}

// ===== SHOP =====
const SHOP=[{k:'hp',ic:'❤️',n:'Iron Sutures',d:'+12% max HP for the party'},{k:'atk',ic:'🗡️',n:'Bell-Iron Edges',d:'+10% damage'},{k:'mp',ic:'🔮',n:'Ash Tincture',d:'+12% max MP'},{k:'heal',ic:'💉',n:'Mott\'s Laudanum',d:'+15% healing'},{k:'crit',ic:'🎯',n:'Greyeye Lenses',d:'+4% crit chance'}];
let shopBack=()=>show('s-menu');
function cost(k){return 40+U[k]*45}
function openShop(){show('s-shop');$('sh-list').innerHTML=SHOP.map(s=>`<div class="shopitem"><div class="ic">${s.ic}</div><div class="d">${s.n} <b style="color:#e8c27a">Lv ${U[s.k]}</b><small>${s.d}</small></div><button class="btn" data-k="${s.k}" ${S.marks<cost(s.k)||U[s.k]>=8?'disabled':''}>${U[s.k]>=8?'MAX':'🜂 '+cost(s.k)}</button></div>`).join('')+`<div class="warn">Upgrades are permanent and take effect on your next run. HP/MP upgrades bought mid-run also heal you.</div>`;
 $('sh-list').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(S.marks<cost(k))return;S.marks-=cost(k);U[k]++;SFX.coin();emberBurst(innerWidth/2,innerHeight/2,30,'255,210,100');if(S.run&&(k==='hp'||k==='mp'))S.run.party.forEach(p=>{const H=hero(p.id);if(k==='hp'){p.mhp=Math.round(H.hp*(1+.12*U.hp));p.hp=Math.min(p.mhp,p.hp+Math.round(H.hp*.12))}else{p.mmp=Math.round(H.mp*(1+.12*U.mp));p.mp=p.mmp}});save();openShop()})}
$('sh-back').onclick=()=>{SFX.click();shopBack()};

// ===== MENU =====
$('b-new').onclick=()=>{ac();drone();SFX.bell();newRun();story('Prologue',NODES[0].pre,()=>startBattle(0),'⚔️ Fight')};
$('b-cont').onclick=()=>{ac();drone();SFX.click();toMap()};
$('b-shop').onclick=()=>{ac();SFX.click();shopBack=()=>show('s-menu');openShop()};
$('b-lore').onclick=()=>{ac();SFX.click();story('The Book of Veyl',LORE,()=>show('s-menu'),'Close')};
$('ov-retry').onclick=()=>{SFX.click();newRun();toMap()};$('ov-menu').onclick=()=>{SFX.click();show('s-menu')};
refreshMenu();
</script></body></html>
