<div class="ov on" id="menu"><h1>Ashes of the<br>Ninth Bell</h1><h2>Chapter I · The Drowned Road</h2><p>Year 512. The bells of Cindermouth drink the god beneath the earth. Something in the marsh drinks back.</p><button class="btn" id="mPlay">Walk the Road</button><button class="btn" id="mShop">Ash Altar (Upgrades)</button><button class="btn" id="mSet">Settings</button><p id="mHi" style="color:#a8968a;font-size:14px"></p></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const SK='aotnb_v2';
let S=Object.assign({ash:0,hi:0,up:{vig:0,edge:0,emb:0,sat:0},mu:60,fx:80,sh:true},JSON.parse(localStorage.getItem(SK)||'{}'));
const save=()=>localStorage.setItem(SK,JSON.stringify(S));
// ---- dark procedural audio ----
let AC=null,mG,fG,rev,mode='',nextBar=0,bar=0;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 const comp=AC.createDynamicsCompressor();comp.connect(AC.destination);

 for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,2.6)}
 rev.buffer=b;const rg=AC.createGain();rg.gain.value=.5;rev.connect(rg);rg.connect(comp);vol();
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=R()*2-1;
 const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=380;bp.Q.value=.6;
 const wg=AC.createGain();wg.gain.value=.05;const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=220;
 lfo.connect(lg);lg.connect(bp.frequency);ns.connect(bp);bp.connect(wg);wg.connect(mG);ns.start();lfo.start();
 if(AC.state==='suspended')AC.resume();setInterval(sched,100)}
function vol(){if(!AC)return;mG.gain.value=S.mu/100*.7;fG.gain.value=S.fx/100}
function tone(f,t,d,o={}){const{type='sine',g=.2,out=mG,a=.01,wet=.4,fe=0,q=0}=o;const os=AC.createOscillator(),e=AC.createGain();os.type=type;os.frequency.setValueAtTime(f,t);if(fe)os.frequency.exponentialRampToValueAtTime(fe,t+d);
 let n=os;if(q){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=q;os.connect(fl);n=fl}
 e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(e);e.connect(out);
 if(wet){const w=AC.createGain();w.gain.value=wet;e.connect(w);w.connect(rev)}os.start(t);os.stop(t+d+.05)}
function noise(t,d,o={}){const{g=.3,f=800,type='lowpass',out=fG,wet=.2}=o;const b=AC.createBuffer(1,Math.max(1,AC.sampleRate*d|0),AC.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(R()*2-1)*(1-i/c.length);
 const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;const e=AC.createGain();e.gain.value=g;s.connect(fl);fl.connect(e);e.connect(out);
 if(wet){const w=AC.createGain();w.gain.value=wet;e.connect(w);w.connect(rev)}s.start(t)}
function bell(f,t,g=.12,out=mG){[1,2.76,5.4,8.93].forEach((m,i)=>tone(f*m,t,6/(i+1),{g:g/(i+1),wet:.9,a:.002,out}))}
const MI=n=>440*Math.pow(2,(n-69)/12);
function sched(){if(!AC||!mode)return;const now=AC.currentTime;if(nextBar<now)nextBar=now+.05;while(nextBar<now+.3){playBar(nextBar);nextBar+=(mode==='explore'||mode==='menu')?4.8:2.4;bar++}}
function playBar(t){
 if(mode==='explore'||mode==='menu'){
  tone(MI(26),t,5.2,{type:'sawtooth',g:.09,q:170,a:1.5,wet:.3});
  tone(MI(38),t,5.2,{type:'sawtooth',g:.03,q:420,a:2,wet:.6});
  [[50,51,57],[50,53,56],[48,51,55],[49,53,56]][bar%4].forEach(n=>tone(MI(n),t+.2,4.8,{type:'triangle',g:.022,a:2.2,wet:.9,q:900}));
  if(bar%2==0)bell(MI(mode==='menu'?37:38),t+R()*2,.07);
  if(bar%3==1)[62,63,61,58].forEach((n,i)=>tone(MI(n),t+1+i*.9,1.6,{g:.022,wet:1,a:.3}));
 }else{const boss=mode==='boss';
  tone(MI(26),t,2.4,{type:'sawtooth',g:.12,q:boss?260:160,a:.05,wet:.2});
  for(let i=0;i<4;i++){const tt=t+i*.6;tone(boss?55:60,tt,.5,{g:.5,fe:30,wet:.15,a:.002});if(i%2)tone(62,tt+.15,.35,{g:.3,fe:32,wet:.1,a:.002})}
  (boss?[50,56,50,57]:[50,51,50,48]).forEach((n,i)=>tone(MI(n),t+i*.6,.55,{type:'square',g:.028,q:700,wet:.5}));
  if(boss){tone(MI(44),t,2.3,{type:'sawtooth',g:.04,q:600,a:.4,wet:.7});if(bar%2==0)bell(MI(32),t,.12);[74,75,74,68].forEach((n,i)=>tone(MI(n),t+i*.6,.5,{g:.022,wet:1,a:.05}))}}}
function music(m){if(m===mode)return;mode=m;if(AC)nextBar=AC.currentTime+.1}
const T0=()=>AC&&AC.currentTime;
const sfx={
 hit(){AC&&(noise(T0(),.12,{g:.5,f:1800}),tone(110,T0(),.15,{g:.3,fe:50,out:fG,wet:.1}))},
 swing(){AC&&noise(T0(),.14,{g:.25,f:2500,type:'bandpass'})},
 chop(){AC&&(noise(T0(),.08,{g:.5,f:900}),tone(180,T0(),.1,{g:.25,fe:90,out:fG,wet:.05}))},
 rock(){AC&&(noise(T0(),.1,{g:.4,f:3000,type:'highpass'}),tone(900,T0(),.08,{g:.08,out:fG}))},
 fire(){AC&&(noise(T0(),.5,{g:.35,f:600}),tone(300,T0(),.4,{type:'sawtooth',g:.08,fe:80,out:fG,q:1200}))},
 gun(){AC&&(noise(T0(),.4,{g:.8,f:1500,wet:.6}),tone(80,T0(),.3,{g:.5,fe:30,out:fG}))},
 pick(){AC&&(tone(880,T0(),.15,{g:.1,out:fG,wet:.5}),tone(1320,T0()+.07,.2,{g:.08,out:fG,wet:.5}))},
 hurt(){AC&&(tone(140,T0(),.3,{type:'sawtooth',g:.18,fe:60,out:fG,q:800}),noise(T0(),.15,{g:.3,f:600}))},
 heal(){AC&&[72,76,79,84].forEach((n,i)=>tone(MI(n),T0()+i*.07,.6,{g:.06,out:fG,wet:.8}))},
 clue(){AC&&(bell(MI(50),T0(),.25,fG),bell(MI(57),T0()+.4,.18,fG))},
 die(){AC&&(tone(200,T0(),.8,{type:'sawtooth',g:.15,fe:40,out:fG,q:600}),noise(T0(),.6,{g:.3,f:400}))},
 step(){AC&&noise(T0(),.05,{g:.05,f:400,wet:0})}
};

// ---- 3D scene + world ----
const cv=$('c');
const rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});
rd.setPixelRatio(Math.min(2,devicePixelRatio||1));rd.outputEncoding=THREE.sRGBEncoding;
rd.toneMapping=THREE.ACESFilmicToneMapping;rd.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07040a);scene.fog=new THREE.FogExp2(0x0a0610,.05);
const cam=new THREE.PerspectiveCamera(45,1,.1,200);
function rsz(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?55:42;cam.updateProjectionMatrix()}
addEventListener('resize',rsz);rsz();
scene.add(new THREE.HemisphereLight(0x5a5a90,0x1a0a08,.6));
const moon=new THREE.DirectionalLight(0x8a9cff,.6);moon.position.set(-20,30,10);scene.add(moon);
const heroLight=new THREE.PointLight(0xff8a3a,2.2,11,1.6);scene.add(heroLight);
const MW=64,MH=48;
const POI={village:[8,24],camp:[34,9],hanged:[54,38],shrine:[22,36],chapel:[58,9]};
let map=[],world=new THREE.Group();scene.add(world);
function hh(x,y,s=0){let h=(x*374761393+y*668265263+s*1442695)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
 return lerp(lerp(hh(xi,yi,s),hh(xi+1,yi,s),u),lerp(hh(xi,yi+1,s),hh(xi+1,yi+1,s),u),v)}
const tAt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?7:map[y*MW+x];
const solid=t=>t===1||t===2||t===3||t===7;
let seed=1;const idxOf={};
function carve(ax,ay,bx,by){let x=ax,y=ay,g=0;while((x!==bx||y!==by)&&g++<500){for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const i=(y+dy)*MW+x+dx;if(map[i]!==undefined&&map[i]!==7)map[i]=4}
 if(Math.abs(bx-x)>Math.abs(by-y)||(R()<.3&&x!==bx))x+=Math.sign(bx-x);else y+=Math.sign(by-y)}}
function clearAt(c,d,r,t=5){for(let y=d-r;y<=d+r;y++)for(let x=c-r;x<=c+r;x++)if(x>0&&y>0&&x<MW-1&&y<MH-1&&Math.hypot(x-c,y-d)<=r+.3)map[y*MW+x]=t}
function genWorld(){seed=(R()*9999)|0;map=new Array(MW*MH);
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const n=vn(x/7,y/7,seed),w=vn(x/11,y/11,seed+5),r=hh(x,y,seed+9);
  let t=0;if(x==0||y==0||x==MW-1||y==MH-1)t=1;else if(w>.74)t=2;else if(n>.6)t=r<.75?1:0;else if(r<.025)t=3;else if(r<.05)t=8;else if(n>.5&&r<.2)t=1;map[y*MW+x]=t}
 for(let y=36;y<47;y++)for(let x=10;x<34;x++)if(Math.hypot((x-21)/1.6,y-42)<5)map[y*MW+x]=2;
 const P=POI,v=P.village;carve(v[0],v[1],P.camp[0],P.camp[1]);carve(v[0],v[1],P.shrine[0],P.shrine[1]);carve(P.camp[0],P.camp[1],P.chapel[0],P.chapel[1]+4);
 carve(P.camp[0],P.camp[1],P.hanged[0],P.hanged[1]);carve(P.hanged[0],P.hanged[1],P.chapel[0],P.chapel[1]+4);
 clearAt(v[0],v[1],4);clearAt(P.camp[0],P.camp[1],4,0);clearAt(P.hanged[0],P.hanged[1],3,0);clearAt(P.shrine[0],P.shrine[1],3);clearAt(P.chapel[0],P.chapel[1],3);
 for(let k=0;k<70;k++){const x=2+(R()*(MW-4))|0,y=2+(R()*(MH-4))|0;if(map[y*MW+x]===0)map[y*MW+x]=R()<.5?3:8}

const _m=new THREE.Matrix4(),_q=new THREE.Quaternion(),_s=new THREE.Vector3(),_p=new THREE.Vector3(),_c=new THREE.Color(),UP=new THREE.Vector3(0,1,0);
let groundIM;
function groundColor(t,h){if(t===2)_c.setHSL(.6,.5,.06+h*.03);else if(t===4)_c.setHSL(.08,.22,.13+h*.04);else if(t===5)_c.setHSL(.07,.12,.16+h*.03);else if(t===7)_c.setHSL(.75,.05,.18+h*.05);else if(t===6)_c.setHSL(.1,.2,.09+h*.03);else _c.setHSL(.25+h*.06,.3,.07+h*.04);return _c}
function groundMat(x,y,t){const top=t===2?-.35:t===7?1.1:0;_p.set(x,top/2-.5,y);_s.set(1,1+top,1);return _m.compose(_p,_q.identity(),_s)}
function setGround(i,t){map[i]=t;const x=i%MW,y=i/MW|0;groundIM.setMatrixAt(i,groundMat(x,y,t));groundIM.setColorAt(i,groundColor(t,hh(x,y,3)));groundIM.instanceMatrix.needsUpdate=true;groundIM.instanceColor.needsUpdate=true}
function hideTile(i){const o=idxOf[i];if(!o)return;_m.makeScale(0,0,0);o.im.forEach(im=>{im.setMatrixAt(o.k,_m);im.instanceMatrix.needsUpdate=true});delete idxOf[i]}

function buildWorld(){while(world.children.length)world.remove(world.children[0]);for(const k in idxOf)delete idxOf[k];
 const N=MW*MH;groundIM=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),N);
 const trees=[],rocks=[],bushes=[];
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const t=tAt(x,y),i=y*MW+x;groundIM.setMatrixAt(i,groundMat(x,y,t));groundIM.setColorAt(i,groundColor(t,hh(x,y,3)));
  if(t===1)trees.push(i);if(t===3)rocks.push(i);if(t===8)bushes.push(i)}

 const tg=new THREE.ConeGeometry(.55,1.8,6);tg.translate(0,1.4,0);

 trees.forEach((i,k)=>{const x=i%MW,y=i/MW|0,s=.8+hh(x,y,7)*.6;_p.set(x+(hh(x,y,1)-.5)*.3,0,y+(hh(x,y,2)-.5)*.3);_s.set(s,s*(.9+hh(x,y,4)*.5),s);
  _m.compose(_p,_q.setFromAxisAngle(UP,hh(x,y,5)*6),_s);treeIM.setMatrixAt(k,_m);trunk.setMatrixAt(k,_m);_c.setHSL(.3+hh(x,y,6)*.08,.4,.07+hh(x,y,8)*.06);treeIM.setColorAt(k,_c);idxOf[i]={im:[treeIM,trunk],k,hp:3}});
 const rg=new THREE.DodecahedronGeometry(.45,0);rg.translate(0,.25,0);const rockIM=new THREE.InstancedMesh(rg,new THREE.MeshLambertMaterial({color:0x4a4450}),rocks.length);

 cam.position.set(BW/2-.5,innerWidth<innerHeight?15:11,BH+ (innerWidth<innerHeight?3.5:4));cam.lookAt(BW/2-.5,0,BH/2-.2);
 info('Your turn. Tap a hero, tap a blue tile to move, then tap a red-marked enemy to attack. Range matters: Sera cannot strike adjacent foes, Ivo needs distance, Dain must close in.')}
function tileMesh(t,x,y){const h=t===4?.35:t===2?-.12:0,col=[0x2a2630,0x3a3028,0x0a2a2a,0x2a2a34,0x5a4a2a][t];
 const m=new THREE.Mesh(new THREE.BoxGeometry(.96,.4+h,.96),M(col,{roughness:t===2?.15:.9,metalness:t===2?.4:0,emissive:t===2?0x05302a:t===4?0x3a1a00:0}));m.position.set(x,(h-.4)/2,y);m.userData={x,y};
 if(t===1)for(let k=0;k<3;k++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+R()*.1),M(0x4a4038));r.position.set((R()-.5)*.6,.25,(R()-.5)*.6);m.add(r)}
 if(t===3){const p=new THREE.Mesh(new THREE.CylinderGeometry(.3,.35,2.4,8),M(0x3a3a46));p.position.y=1.2;m.add(p)}
 if(t===4){const c=glowSprite('rgba(255,170,60,.8)',.8);c.position.y=.5;m.add(c)}return m}
function rebuildTile(x,y){const i=y*BW+x;bGrp.remove(B.tiles[i]);B.tiles[i]=tileMesh(B.g[i],x,y);bGrp.add(B.tiles[i])}
function addUnit(u){u.o=makeChar(u.k);u.o.position.set(u.x,tH(u.x,u.y),u.y);u.o.rotation.y=u.team==='hero'?Math.PI:0;bGrp.add(u.o);
 const ring=new THREE.Mesh(new THREE.RingGeometry(.36,.44,24),new THREE.MeshBasicMaterial({color:u.team==='hero'?0xffa040:0x40ffd0,transparent:true,opacity:.7,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.04;u.o.add(ring);
 const hb=document.createElement('div');hb.style.cssText='position:absolute;width:44px;height:6px;background:#300;border:1px solid #000;border-radius:3px;transform:translate(-50%,-50%)';hb.innerHTML='<i style="display:block;height:100%;background:'+(u.team==='hero'?'#ff5a3a':'#3affc0')+'"></i>';fxLayer.appendChild(hb);u.hb=hb;
 u.moved=false;u.acted=false;B.units.push(u);return u}
const tH=(x,y)=>B.g[y*BW+x]===4?.35:B.g[y*BW+x]===2?-.12:0;
function info(t){$('bti').innerHTML=t}

const uAt=(x,y)=>B.units.find(u=>u.hp>0&&u.x===x&&u.y===y);
function reach(u){const best=new Map([[u.x+','+u.y,0]]),q=[[u.x,u.y,0]];while(q.length){q.sort((a,b)=>a[2]-b[2]);const[x,y,c]=q.shift();
 for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=BW||ny>=BH)continue;const t=B.g[ny*BW+nx],nc=c+COST[t];if(nc>u.mv)continue;
  const o=uAt(nx,ny);if(o&&o.team!==u.team)continue;const k=nx+','+ny;if(best.has(k)&&best.get(k)<=nc)continue;best.set(k,nc);q.push([nx,ny,nc])}}
 return[...best.keys()].map(s=>s.split(',').map(Number)).filter(([x,y])=>!uAt(x,y)||uAt(x,y)===u)}
function los(ax,ay,bx,by){const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay))*3;for(let i=1;i<n;i++){const x=Math.round(lerp(ax,bx,i/n)),y=Math.round(lerp(ay,by,i/n));if((x!==ax||y!==ay)&&(x!==bx||y!==by)&&B.g[y*BW+x]===3)return false}return true}
function canHit(u,x,y,t){const d=Math.abs(t.x-x)+Math.abs(t.y-y),mx=u.rmax+(B.g[y*BW+x]===4?1:0);return d>=u.rmin&&d<=mx&&(d===1||los(x,y,t.x,t.y))}
function targets(u){const heal=u.k==='mott';return B.units.filter(t=>t.hp>0&&((t.team!==u.team&&canHit(u,u.x,u.y,t))||(heal&&t.team===u.team&&t!==u&&t.hp<t.max&&canHit(u,u.x,u.y,t))))}
function clearOv(){while(B.ov.children.length)B.ov.remove(B.ov.children[0])}
function mark(x,y,col,op=.45){const m=new THREE.Mesh(new THREE.PlaneGeometry(.9,.9),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.set(x,tH(x,y)+.03,y);B.ov.add(m)}
function showSel(){clearOv();const u=B.sel;if(!u)return;if(!u.moved)reach(u).forEach(([x,y])=>mark(x,y,0x3a7aff,.35));
 if(!u.acted)targets(u).forEach(t=>mark(t.x,t.y,t.team===u.team?0x40ff80:0xff2a2a,.6));mark(u.x,u.y,0xffc040,.5);
 info(`<b style="color:#e8c27a">${u.name}</b>  HP ${u.hp}/${u.max} · Move ${u.mv} · Range ${u.rmin}-${u.rmax}<br><small>${TN[B.g[u.y*BW+u.x]]}</small>`)}
const ray=new THREE.Raycaster(),_mv=new THREE.Vector2();
async function btTap(px,py){if(!B||B.phase!=='player'||B.busy||dlgOpen)return;_mv.set(px/innerWidth*2-1,-(py/innerHeight)*2+1);ray.setFromCamera(_mv,cam);
 const hit=ray.intersectObjects(B.tiles,true)[0];if(!hit)return;let o=hit.object;while(o&&!('x' in o.userData))o=o.parent;if(!o)return;const{x,y}=o.userData,u=B.sel,t=uAt(x,y);
 if(t&&t.team==='hero'&&!(u&&u.k==='mott'&&!u.acted&&t!==u&&targets(u).includes(t))){if(t.acted&&t.moved)return info(`${t.name} has finished this turn.`);B.sel=t;sfx.step();return showSel()}
 if(!u)return info(TN[B.g[y*BW+x]]);
 if(t&&!u.acted&&targets(u).includes(t)){B.busy=true;await act(u,t);u.acted=true;u.moved=true;B.sel=null;clearOv();B.busy=false;return checkEnd()||autoEnd()}
 if(!t&&!u.moved&&reach(u).some(([a,b])=>a===x&&b===y)){B.busy=true;await walk(u,x,y);u.moved=true;B.busy=false;if(!targets(u).length){u.acted=true;B.sel=null;clearOv();info(`${u.name} moved. No targets in range from here.`);return autoEnd()}return showSel()}
 info(TN[B.g[y*BW+x]])}
async function walk(u,x,y){const sx=u.x,sy=u.y;u.o.rotation.y=Math.atan2(x-sx,y-sy);for(let i=1;i<=12;i++){u.o.position.set(lerp(sx,x,i/12),lerp(tH(sx,sy),tH(x,y),i/12),lerp(sy,y,i/12));animChar(u.o,.05,true);await sleep(22)}u.x=x;u.y=y;sfx.step()}
function dmgCalc(a,t){const d=Math.abs(t.x-a.x)+Math.abs(t.y-a.y);let v=a.atk*(.9+R()*.25);if(B.g[a.y*BW+a.x]===4)v*=1.25;if(B.g[a.y*BW+a.x]===2)v*=.8;if(d>1&&B.g[t.y*BW+t.x]===1)v*=.6;if(t.k==='dain')v*=.7;return Math.max(1,Math.round(v))}
async function act(a,t){a.o.rotation.y=Math.atan2(t.x-a.x,t.y-a.y);a.o.userData.atk=.25;
 if(a.k==='mott'&&t.team===a.team){const h=14+((R()*6)|0);t.hp=Math.min(t.max,t.hp+h);sfx.heal();pop(t.x,t.y,'+'+h,'#7f7');burst(t.x,1,t.y,'rgba(120,255,140,.9)',14);await sleep(450);return}
 const ranged=Math.abs(t.x-a.x)+Math.abs(t.y-a.y)>1;if(ranged){const col=a.k==='sera'?'rgba(255,130,40,1)':a.k==='ivo'?'rgba(255,230,140,1)':'rgba(60,255,200,1)';(a.k==='ivo'?sfx.gun:a.k==='sera'?sfx.fire:sfx.hurt)();
  const s=glowSprite(col,.8);bGrp.add(s);for(let i=0;i<=10;i++){s.position.set(lerp(a.x,t.x,i/10),.9,lerp(a.y,t.y,i/10));if(i%2)burst(s.position.x,.9,s.position.z,col,1,.4,.3,.3);await sleep(25)}bGrp.remove(s)}else{sfx.swing();await sleep(150)}
 const d=dmgCalc(a,t);t.hp-=d;t.o.userData.flash=.3;sfx.hit();doShake(.3);pop(t.x,t.y,d,a.team==='hero'?'#ffcf6a':'#ff4a4a',d>20);burst(t.x,.9,t.y,'rgba(255,60,40,.9)',12,3);await sleep(350);
 if(t.hp<=0){t.hp=0;sfx.die();burst(t.x,.8,t.y,t.team==='foe'?'rgba(60,255,200,.8)':'rgba(255,80,40,.8)',26,4,.35,1);t.o.visible=false;t.hb.remove()}
 if(t===B.boss&&!B.p2&&t.hp>0&&t.hp<=t.max/2){B.p2=true;t.mv=3;t.atk+=4;if(AC)bell(MI(30),T0(),.3,fG);doShake(.6);
  for(let k=0;k<10;k++){const x=(R()*BW)|0,y=(R()*BH)|0,i=y*BW+x;if(B.g[i]===0&&!uAt(x,y)){B.g[i]=2;rebuildTile(x,y)}}
  await new Promise(r=>talk([{n:'Deacon Orm',t:'"The tide answers its priest!" Black water surges across the chapel floor. The Deacon grows faster and hungrier.'}],r))}}

function autoEnd(){if(B.units.filter(u=>u.team==='hero'&&u.hp>0).every(u=>u.acted&&u.moved))endTurn()}
$('bWait').onclick=()=>{if(!B||B.busy||!B.sel)return;B.sel.moved=B.sel.acted=true;B.sel=null;clearOv();info('Waiting.');autoEnd()};
$('bEnd').onclick=()=>{if(B&&!B.busy&&B.phase==='player')endTurn()};
function checkEnd(){if(B.boss.hp<=0){setTimeout(victory,900);B.phase='over';return true}if(!B.units.some(u=>u.team==='hero'&&u.hp>0)){B.phase='over';setTimeout(()=>gameOver(false),900);return true}return false}
async function endTurn(){B.phase='enemy';B.sel=null;clearOv();info('<span style="color:#3affc0">The congregation moves…</span>');await sleep(400);
 if(B.turn%3===0&&B.boss.hp>0){let n=0;for(const[dx,dy]of[[1,1],[-1,1],[2,0],[-2,0],[0,2]]){const x=B.boss.x+dx,y=B.boss.y+dy;if(n<2&&x>=0&&y>=0&&x<BW&&y<BH&&B.g[y*BW+x]!==3&&!uAt(x,y)){addUnit({k:'drowned',team:'foe',x,y,hp:26,max:26,atk:8,mv:3,rmin:1,rmax:1,name:'Drowned'});burst(x,.5,y,'rgba(60,255,200,.9)',16,3);n++}}
  if(n){sfx.hurt();pop(B.boss.x,B.boss.y,'RISE','#3affc0',true);await sleep(500)}}
 for(const e of B.units.filter(u=>u.team==='foe'&&u.hp>0)){if(B.phase==='over')break;const heroes=B.units.filter(u=>u.team==='hero'&&u.hp>0);if(!heroes.length)break;
  let best=null;for(const[x,y]of reach(e)){for(const h of heroes){if(canHit(e,x,y,h)){const sc=(h.max-h.hp)+(h.k==='dain'?-30:0)+(B.g[y*BW+x]===4?8:0)-(Math.abs(x-e.x)+Math.abs(y-e.y));if(!best||sc>best.sc)best={x,y,h,sc}}}}
  if(best){if(best.x!==e.x||best.y!==e.y)await walk(e,best.x,best.y);await act(e,best.h)}
  else{const h=heroes.sort((a,b)=>Math.abs(a.x-e.x)+Math.abs(a.y-e.y)-Math.abs(b.x-e.x)-Math.abs(b.y-e.y))[0];const r=reach(e).sort((a,b)=>Math.abs(a[0]-h.x)+Math.abs(a[1]-h.y)-Math.abs(b[0]-h.x)-Math.abs(b[1]-h.y))[0];if(r&&(r[0]!==e.x||r[1]!==e.y))await walk(e,r[0],r[1])}
  if(checkEnd())return;await sleep(150)}
 B.turn++;B.units.forEach(u=>{u.moved=u.acted=false});B.phase='player';info(`Turn ${B.turn}. ${B.turn%3===0?'<span style="color:#3affc0">The font churns: more drowned will rise at the end of this turn.</span>':'Your move.'}`)}
function updBattle(dt){if(!B)return;B.units.forEach(u=>{if(u.hp<=0)return;animChar(u.o,dt,false);_v.set(u.x,u.k==='orm'?3.2:2,u.y).project(cam);u.hb.style.left=((_v.x+1)/2*innerWidth)+'px';u.hb.style.top=((1-_v.y)/2*innerHeight)+'px';u.hb.firstChild.style.width=(u.hp/u.max*100)+'%';
  u.o.position.y=tH(u.x,u.y)+(u.o.userData.rig.position.y*0)});
 const base=new THREE.Vector3(BW/2-.5,innerWidth<innerHeight?15:11,BH+(innerWidth<innerHeight?3.5:4));cam.position.set(base.x+(R()-.5)*shake,base.y,base.z+(R()-.5)*shake);shake=Math.max(0,shake-dt*1.5)}
function endBattle(){if(B)B.units.forEach(u=>u.hb.remove());B=null;bGrp.visible=false;$('bt').classList.remove('on')}
function victory(){endBattle();state='end';G.score+=1000+G.party.length*200;finishRun();sfx.clue();
 $('eT').textContent='The Deacon Drowns';$('eP').innerHTML='Orm sinks into the font. As he dies, every bell in Cindermouth tolls at once, nine times.<br><br>In the silence after, the drowned children of Hollowmere speak together in a woman\'s voice: <i>"Sera. Granddaughter. You are ringing the wrong bell."</i><br><br><b>Chapter II: The Foundry of Brothers</b> is coming.';showEnd()}
function gameOver(){if(state==='end')return;endBattle();state='end';sfx.die();music('menu');finishRun();$('eT').textContent='Claimed by the Marsh';$('eP').textContent='The hymn takes one more voice. The bells keep ringing in Cindermouth.';showEnd()}
function finishRun(){const s=G.score+G.res.coin*2;const ash=Math.floor(s/20);S.ash+=ash;if(s>S.hi)S.hi=s;save();$('eS').textContent=`Score ${s} · +${ash} Ash · Best ${S.hi}`}
function showEnd(){['hud','ctl'].forEach(i=>$(i).classList.remove('on'));$('dlg').classList.remove('on');dlgOpen=false;$('end').classList.add('on')}

// ---- menus + loop ----
const ovs=['menu','shop','set','pause','end'];function show(id){ovs.forEach(o=>$(o).classList.toggle('on',o===id))}
const UPS=[['vig','Vigor','+15 max HP',30],['edge','Edge','+3 damage',35],['emb','Ember','+8 max ember',30],['sat','Satchel','+1 starting tonic',25]];
function renderShop(){$('shAsh').textContent=`Ash: ${S.ash}`;$('shL').innerHTML='';UPS.forEach(([k,n,d,c])=>{const lv=S.up[k],cost=c*(lv+1),r=document.createElement('div');r.className='row';
 r.innerHTML=`<div>${n} <small>${d} · Level ${lv}/5</small></div>`;const b=document.createElement('button');b.textContent=lv>=5?'MAX':cost+' Ash';b.onclick=()=>{if(lv<5&&S.ash>=cost){S.ash-=cost;S.up[k]++;save();sfx.pick();renderShop()}};r.appendChild(b);$('shL').appendChild(r)})}
// menu showcase: the four heroes in 3D

const scFloor=new THREE.Mesh(new THREE.CircleGeometry(4,32),M(0x1a1014,{roughness:1}));scFloor.rotation.x=-Math.PI/2;showcase.add(scFloor);const scL=new THREE.PointLight(0xff7a30,3,8);scL.position.set(0,2,2);showcase.add(scL);

let last=performance.now(),mt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;mt+=dt;
 if(state==='explore'&&G)updExplore(dt);else if(state==='battle')updBattle(dt);
 else if(state==='menu'||state==='end'){cam.position.set(500+Math.sin(mt*.2)*.6,1.6,504.2);cam.lookAt(500,.9,500);showcase.children.forEach(o=>o.userData&&o.userData.rig&&animChar(o,dt,false));scL.intensity=2.6+Math.sin(mt*9)*.3}
